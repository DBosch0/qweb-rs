name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A new push to the same branch or PR cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  # Formatting and clippy, once (they don't depend on the OS).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The Python package ships copies (PEP 639 forbids paths outside the package).
      - name: License copies in crates/qweb-python match the root
        run: cmp LICENSE crates/qweb-python/LICENSE && cmp COPYRIGHT crates/qweb-python/COPYRIGHT

  # API docs build without warnings (broken or private intra-doc links, ...).
  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --locked
      - run: cargo doc --workspace --no-deps --document-private-items --locked

  # Minimum supported Rust version: `rust-version` in the root Cargo.toml
  # (let-chains need 1.88). Builds and tests with exactly that toolchain and
  # the committed Cargo.lock, native and wasm32.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets --locked
      - run: cargo build -p qweb-core -p qweb-value -p qweb-wasm --target wasm32-unknown-unknown --locked

  # Rust unit tests and the native conformance cases on every major OS.
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # qweb-python (pyo3) is a workspace member: its tests link against Python.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  # WebAssembly: the core stays WASM-clean, its tests pass inside a WASM
  # runtime, and the wasm-bindgen package builds and works in Node.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      # The wasm-bindgen CLI must match the crate exactly: read it from Cargo.lock.
      - id: wb
        run: echo "version=$(cargo pkgid -p wasm-bindgen | sed 's/.*@//')" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasmtime,wasm-bindgen@${{ steps.wb.outputs.version }}
      - name: Core builds for wasm32-unknown-unknown
        run: cargo build -p qweb-core -p qweb-value --target wasm32-unknown-unknown --locked
      - name: Core tests under wasmtime (wasm32-wasip1)
        # every_length spawns a thread, which wasip1 does not support.
        run: >-
          cargo test -p qweb-core -p qweb-value -p qweb-inherit
          --target wasm32-wasip1 --locked -- --skip xstr::tests::every_length
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime run --dir=/
      - name: Build the wasm-bindgen package
        run: scripts/build_wasm.sh
      - name: Node smoke test
        run: node tests/wasm/smoke.mjs target/wasm-pkg/nodejs
      - name: Size
        run: |
          f=target/wasm-pkg/no-modules/qweb_wasm_bg.wasm
          echo "qweb_wasm_bg.wasm: $(wc -c < $f) bytes, $(gzip -9c $f | wc -c) gzipped" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: wasm-pkg
          path: target/wasm-pkg

  # Python wheel (abi3, so one wheel per platform covers Python >= 3.12),
  # then the conformance and bridge tests against the installed wheel.
  # No Odoo checkout is needed: cases.json holds the expected outputs.
  python:
    name: python (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, manylinux: auto }
          - { os: ubuntu-24.04-arm, manylinux: auto }
          - { os: macos-latest }
          - { os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/qweb-python
          args: --release --locked --out dist
          manylinux: ${{ matrix.manylinux }}
          sccache: true
      - uses: astral-sh/setup-uv@v7
      - name: Check the package metadata (what PyPI will render)
        shell: bash
        run: uvx twine check --strict crates/qweb-python/dist/*.whl
      - name: Test the wheel (oldest and newest supported Python)
        shell: bash
        run: |
          wheel=$(ls crates/qweb-python/dist/*.whl)
          # An open() without encoding= decodes cases.json as cp1252 on Windows:
          # make it an error on every OS.
          export PYTHONWARNDEFAULTENCODING=1
          for py in 3.12 3.14; do
            uv run --no-project --isolated --python "$py" \
              --with "$wheel" --with pytest --with lxml --with markupsafe \
              python -W error::EncodingWarning -m pytest tests/conformance -q
          done
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}
          path: crates/qweb-python/dist/*.whl

  # Miri on the core's only unsafe code (xstr.rs).
  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo miri test -p qweb-core --locked xstr

  # Line coverage of the Rust code, from both the Rust tests and the Python
  # tests (which run the instrumented extension module).
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Run tests with instrumentation
        run: |
          source <(cargo llvm-cov show-env --sh)
          cargo llvm-cov clean --workspace
          cargo test --workspace --locked
          uv venv .venv
          uv pip install --python .venv maturin pytest lxml markupsafe
          (cd crates/qweb-python && VIRTUAL_ENV="$GITHUB_WORKSPACE/.venv" ../../.venv/bin/maturin develop --uv)
          .venv/bin/python -m pytest tests/conformance -q
          cargo llvm-cov report --lcov --output-path lcov.info
          { echo '```'; cargo llvm-cov report --summary-only; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: lcov
          path: lcov.info
      # Needs the CODECOV_TOKEN repository secret (see codecov.io); harmless without it.
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # Public API compatibility of the published crates (qweb-core, qweb-value,
  # qweb-inherit, qweb-wasm) against their latest version on crates.io.
  # Fails when a change needs a bigger version bump than Cargo.toml has: in
  # 0.x, a breaking change needs the minor version bumped (0.1.x -> 0.2.0).
  # qweb-python is skipped (publish = false).
  semver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: obi1kenobi/cargo-semver-checks-action@v2

  # Dependency policy (deny.toml): licenses, banned/duplicate crates, sources,
  # and RustSec advisories. A new advisory can appear without any change here,
  # so it is reported but does not fail the build.
  cargo-deny:
    name: cargo-deny (${{ matrix.checks }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checks: [advisories, bans licenses sources]
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}
