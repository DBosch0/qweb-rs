# Build the qweb-rs Python package (wheels + sdist) and publish it.
#
#   push tag vX.Y.Z  -> TestPyPI, then PyPI after approval (environment `pypi`)
#   manual run       -> TestPyPI only (a dry run of the whole pipeline)
#
# Uploads use PyPI trusted publishing (OIDC): no API token is stored. On
# test.pypi.org and pypi.org, add a (pending) trusted publisher with
# owner DBosch0, repository qweb-rs, workflow release-python.yml and
# environment `testpypi` / `pypi` respectively.
name: Release Python

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The tag must match [workspace.package] version in Cargo.toml.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check tag against Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}"
            exit 1
          fi

  sdist:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/qweb-python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: crates/qweb-python/dist

  # One abi3 wheel per platform covers every CPython >= 3.12.
  wheels:
    needs: version
    name: wheel (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: manylinux-x86_64, os: ubuntu-latest, target: x86_64, manylinux: auto, test: true }
          - { name: manylinux-aarch64, os: ubuntu-24.04-arm, target: aarch64, manylinux: auto, test: true }
          - { name: musllinux-x86_64, os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { name: musllinux-aarch64, os: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2 }
          - { name: macos-arm64, os: macos-latest, target: aarch64, test: true }
          - { name: macos-x86_64, os: macos-latest, target: x86_64 }
          - { name: windows-x64, os: windows-latest, target: x64, test: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/qweb-python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist
      # Wheels this runner can install: run the conformance tests on them.
      - uses: astral-sh/setup-uv@v7
        if: matrix.test
      - name: Test the wheel
        if: matrix.test
        shell: bash
        run: |
          uv run --no-project --isolated --python 3.12 \
            --with "$(ls crates/qweb-python/dist/*.whl)" --with pytest --with lxml --with markupsafe \
            python -m pytest tests/conformance -q
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.name }}
          path: crates/qweb-python/dist

  testpypi:
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/qweb-rs/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # A manual re-run of an already uploaded version is not an error.
          skip-existing: true

  pypi:
    needs: testpypi
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Give this environment a required reviewer: the upload waits for approval.
    environment:
      name: pypi
      url: https://pypi.org/project/qweb-rs/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
