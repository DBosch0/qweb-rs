[package]
name = "qweb-wasm"
description = "WebAssembly bindings: template inheritance (browser and server dialects) and string rendering"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
qweb-core.workspace = true
qweb-value.workspace = true
qweb-inherit.workspace = true
serde_json = { version = "1", features = ["preserve_order"] }
wasm-bindgen = "=0.2.130"

# wasm-pack: optimize for size with wasm-opt (binaryen). Recent Rust emits
# bulk-memory, sign-ext, ... for wasm32, which wasm-opt rejects unless enabled.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-sign-ext", "--enable-mutable-globals", "--enable-reference-types", "--enable-multivalue"]

[package.metadata.wasm-pack.profile.custom]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-sign-ext", "--enable-mutable-globals", "--enable-reference-types", "--enable-multivalue"]

[lints]
workspace = true