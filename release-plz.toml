# release-plz: https://release-plz.dev/docs/config
#
# All crates share the workspace version (`version.workspace = true`), so they
# are released together under one git tag `vX.Y.Z` and one root CHANGELOG.md,
# both owned by qweb-core. qweb-python (`publish = false`) is not published
# to crates.io; the PyPI and npm packages are released by
# .github/workflows/release-{python,npm}.yml, which release-plz.yml starts
# on the new tag.

[workspace]
# One tag, one GitHub release and one changelog, all from qweb-core (below).
git_tag_enable = false
git_release_enable = false
changelog_update = false
changelog_path = "./CHANGELOG.md"
pr_labels = ["release"]

[[package]]
name = "qweb-core"
version_group = "qweb"
git_tag_enable = true
git_tag_name = "v{{ version }}"
git_release_enable = true
git_release_name = "v{{ version }}"
changelog_update = true
# The changelog lists the changes of every package.
changelog_include = ["qweb-value", "qweb-inherit", "qweb-wasm", "qweb-python"]

[[package]]
name = "qweb-value"
version_group = "qweb"

[[package]]
name = "qweb-inherit"
version_group = "qweb"

[[package]]
name = "qweb-wasm"
version_group = "qweb"
